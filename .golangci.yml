version: "2"

linters:
  default: none
  enable:
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: redefines-builtin-id
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    rules:
      - text: "(struct field|method parameter|var) \\w*Id should be \\w*ID"
        linters:
          - revive

formatters:
  enable:
    - gofmt
